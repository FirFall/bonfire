services:
  - type: web
    name: bonfire
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: "PASTE_YOUR_NEON_CONNECTION_STRING_HERE"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
    # databases section removed - using external Postgres from Wispbyte

