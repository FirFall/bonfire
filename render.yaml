services:
  - type: web
    name: bonfire
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: "https://xmansccwyxtbbhyvnijt.supabase.co"
      # Not stored in this file: Render asks for the value when the blueprint is
      # created (or set it later in the service's Environment tab). The repo is
      # public, and this key grants full read/write access to the database.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"

