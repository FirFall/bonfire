services:
  - type: web
    name: discord-clone
    runtime: node
    plan: starter
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discord-clone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"

databases:
  - name: discord-clone-db
    plan: free
    databaseName: discord_clone
    ipAllowList: []
